      <text x="133" y="204" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" letter-spacing="0.5">MASUK SEKARANG</text>

      <!-- Divider -->
      <line x1="0" y1="252" x2="95" y2="252" stroke="#252c4a"/>
      <text x="133" y="256" text-anchor="middle" fill="#6b7399" font-size="11">atau masuk dengan</text>
      <line x1="171" y1="252" x2="266" y2="252" stroke="#252c4a"/>

      <!-- Quick Auth -->
      <rect x="0" y="274" width="126" height="40" rx="10" fill="#171c33" stroke="#262e4d"/>
      <text x="63" y="299" text-anchor="middle" fill="#d0d6f2" font-size="12" font-weight="600">Google</text>
      <rect x="140" y="274" width="126" height="40" rx="10" fill="#171c33" stroke="#262e4d"/>
      <text x="203" y="299" text-anchor="middle" fill="#d0d6f2" font-size="12" font-weight="600">WhatsApp OTP</text>

      <text x="133" y="352" text-anchor="middle" fill="#8b92b2" font-size="11.5">Belum punya akun? <tspan fill="#a29bfe" font-weight="700">Daftar Gratis</tspan></text>
    </g>
  </g>

