<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19"/>
      <stop offset="50%" stop-color="#121629"/>
      <stop offset="100%" stop-color="#0d1021"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#74b9ff"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="cardSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#191e36"/>
      <stop offset="100%" stop-color="#13172b"/>
    </linearGradient>
    <linearGradient id="tentSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2952"/>
      <stop offset="100%" stop-color="#2e4374"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="25%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6c5ce7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#74b9ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#74b9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="phoneShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)"/>
  <rect width="1280" height="800" fill="url(#glowLeft)"/>
  <rect width="1280" height="800" fill="url(#glowRight)"/>

  <!-- Top Header Banner -->
  <g transform="translate(640, 52)" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif">
    <text y="0" fill="#a29bfe" font-size="13" font-weight="700" letter-spacing="3">MOBILE-FIRST WEB APPLICATION · NEXT.JS &amp; TAILWIND CSS</text>
    <text y="28" fill="#f0f0f5" font-size="24" font-weight="800">Sistem Rental Tenda &amp; Perlengkapan Outdoor</text>
  </g>

  <!-- ==================== PHONE 1: SIGN IN FLOW ==================== -->
  <g transform="translate(75, 115)" filter="url(#phoneShadow)" font-family="'Inter', sans-serif">
    <!-- Phone Frame -->
    <rect x="0" y="0" width="330" height="620" rx="34" fill="#14182c" stroke="#2d3558" stroke-width="2.5"/>
    <rect x="12" y="12" width="306" height="596" rx="26" fill="#0f1324"/>
    <!-- Status bar & Notch -->
