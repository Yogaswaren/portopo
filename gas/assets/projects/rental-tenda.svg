      <text x="34" y="18" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Semua</text>

      <rect x="76" y="0" width="68" height="28" rx="14" fill="#171c33" stroke="#2a3256"/>
      <text x="110" y="18" text-anchor="middle" fill="#a5add0" font-size="11" font-weight="600">Tenda</text>

