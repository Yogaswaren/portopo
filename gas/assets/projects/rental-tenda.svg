      <text x="10" y="118" fill="#8b92b2" font-size="10">2 Tenda + 4 Matras + Kompor</text>
      <text x="10" y="140" fill="#a29bfe" font-size="12.5" font-weight="800">Rp 150.000<tspan fill="#7c84a8" font-size="9.5" font-weight="500">/hari</tspan></text>
