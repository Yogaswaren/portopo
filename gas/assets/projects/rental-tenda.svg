      <text x="10" y="140" fill="#a29bfe" font-size="12.5" font-weight="800">Rp 20.000<tspan fill="#7c84a8" font-size="9.5" font-weight="500">/hari</tspan></text>
      <rect x="10" y="146" width="120" height="18" rx="5" fill="#6c5ce7" opacity="0.22"/>
      <text x="70" y="158" text-anchor="middle" fill="#c4bfff" font-size="9.5" font-weight="700">Pilih Alat</text>
