    <text x="32" y="34" fill="#8b92b2" font-size="11" font-weight="600">09:41</text>
    <circle cx="282" cy="29" r="4" fill="#00b894"/>

    <!-- App Logo -->
    <g transform="translate(165, 92)" text-anchor="middle">
      <rect x="-34" y="-34" width="68" height="68" rx="18" fill="url(#accentGrad)" opacity="0.18"/>
      <polygon points="0,-20 -22,18 22,18" fill="none" stroke="#a29bfe" stroke-width="3.2" stroke-linejoin="round"/>
      <polygon points="0,-4 -10,18 10,18" fill="#6c5ce7"/>
      <text y="56" fill="#ffffff" font-size="20" font-weight="800">TentRent<tspan fill="#a29bfe">.id</tspan></text>
      <text y="78" fill="#8b92b2" font-size="12">Masuk untuk menyewa alat camping</text>
    </g>

    <!-- Form Fields -->
    <g transform="translate(32, 200)">
      <text x="0" y="0" fill="#b8bfe0" font-size="11.5" font-weight="600">Email atau No. WhatsApp</text>
      <rect x="0" y="10" width="266" height="44" rx="10" fill="#171c33" stroke="#2c3457" stroke-width="1.5"/>
      <text x="16" y="37" fill="#eef0ff" font-size="12.5">yogas.waren@outdoor.id</text>

      <text x="0" y="80" fill="#b8bfe0" font-size="11.5" font-weight="600">Kata Sandi</text>
      <rect x="0" y="90" width="266" height="44" rx="10" fill="#171c33" stroke="#6c5ce7" stroke-width="1.5"/>
      <text x="16" y="117" fill="#a29bfe" font-size="15" letter-spacing="3">••••••••••</text>

      <text x="266" y="156" text-anchor="end" fill="#a29bfe" font-size="11" font-weight="600">Lupa Kata Sandi?</text>

