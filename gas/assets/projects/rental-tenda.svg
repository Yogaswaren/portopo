        <text x="0" fill="#525a7a">27</text>
        <text x="38" fill="#525a7a">28</text>
        <text x="76">1</text>
        <text x="114">2</text>
        <text x="152">3</text>
        <text x="190">4</text>
        <text x="226">5</text>

        <text x="0" y="34">6</text>
        <text x="38" y="34">7</text>
        <text x="76" y="34" fill="#ffffff" font-weight="800">8</text>
        <text x="114" y="34" fill="#ffffff">9</text>
        <text x="152" y="34" fill="#ffffff">10</text>
        <text x="190" y="34" fill="#ffffff" font-weight="800">11</text>
        <text x="226" y="34">12</text>

        <text x="0" y="68">13</text>
        <text x="38" y="68">14</text>
        <text x="76" y="68">15</text>
        <text x="114" y="68">16</text>
        <text x="152" y="68">17</text>
        <text x="190" y="68">18</text>
        <text x="226" y="68">19</text>
