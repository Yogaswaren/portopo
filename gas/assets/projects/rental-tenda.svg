    <text x="142" y="603" text-anchor="middle" fill="#7c84a8" font-size="11">Katalog</text>
    <text x="216" y="603" text-anchor="middle" fill="#7c84a8" font-size="11">Booking</text>
    <text x="286" y="603" text-anchor="middle" fill="#7c84a8" font-size="11">Profil</text>
  </g>

