      <text x="16" y="28" fill="#8b92b2" font-size="11.5">Durasi Sewa (8–11 Mei)</text>
      <text x="258" y="28" text-anchor="end" fill="#ffffff" font-size="11.5" font-weight="700">3 Hari</text>

      <text x="16" y="54" fill="#8b92b2" font-size="11.5">Harga Sewa (3 × Rp 65.000)</text>
      <text x="258" y="54" text-anchor="end" fill="#ffffff" font-size="11.5" font-weight="600">Rp 195.000</text>

      <text x="16" y="78" fill="#8b92b2" font-size="11.5">Layanan Antar-Jemput</text>
      <text x="258" y="78" text-anchor="end" fill="#00b894" font-size="11.5" font-weight="700">GRATIS</text>

