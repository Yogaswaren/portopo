<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgStage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1320"/>
      <stop offset="50%" stop-color="#101d30"/>
      <stop offset="100%" stop-color="#0a121e"/>
    </linearGradient>
    <linearGradient id="heroBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="55%" stop-color="#00cec9"/>
      <stop offset="100%" stop-color="#6c5ce7"/>
    </linearGradient>
    <linearGradient id="tealBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#0984e3"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00cec9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00cec9" stop-opacity="0"/>
    </radialGradient>
    <filter id="windowShadow" x="-10%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Stage Background -->
  <rect width="1280" height="800" fill="url(#bgStage)"/>
  <rect width="1280" height="800" fill="url(#stageGlow)"/>

  <!-- ==================== DESKTOP BROWSER WINDOW ==================== -->
  <g transform="translate(65, 58)" filter="url(#windowShadow)" font-family="'Inter', sans-serif">
    <rect x="0" y="0" width="940" height="645" rx="18" fill="#131c2e" stroke="#263859" stroke-width="2"/>
    <!-- Browser Top Bar -->
    <rect x="0" y="0" width="940" height="44" rx="18" fill="#18243a"/>
    <rect x="0" y="24" width="940" height="20" fill="#18243a"/>
    <circle cx="24" cy="22" r="6" fill="#ff7675"/>
    <circle cx="44" cy="22" r="6" fill="#fdcb6e"/>
    <circle cx="64" cy="22" r="6" fill="#55efc4"/>
    <rect x="180" y="10" width="540" height="24" rx="6" fill="#0f1726" stroke="#253655"/>
    <text x="450" y="26" text-anchor="middle" fill="#8ba0c2" font-size="11.5">🔒  laundrykita-system.web.app</text>

    <!-- Website Navbar -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="940" height="58" fill="#111a2b"/>
      <circle cx="46" cy="29" r="14" fill="url(#heroBanner)"/>
      <text x="46" y="34" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">LK</text>
      <text x="70" y="35" fill="#ffffff" font-size="17" font-weight="800">Laundry Kita</text>

      <g transform="translate(460, 34)" fill="#b2c2df" font-size="12.5" font-weight="600">
        <text x="0" fill="#00cec9">Beranda</text>
        <text x="76">Paket Cuci</text>
        <text x="164">Cek Estimasi</text>
        <text x="266">Jam Operasional</text>
      </g>
      <rect x="810" y="14" width="100" height="30" rx="8" fill="url(#tealBtn)"/>
      <text x="860" y="33" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Order Cepat</text>
    </g>

    <!-- Hero Banner -->
    <g transform="translate(30, 122)">
      <rect x="0" y="0" width="880" height="190" rx="16" fill="url(#heroBanner)"/>
      <circle cx="760" cy="95" r="110" fill="#ffffff" opacity="0.1"/>
      <circle cx="760" cy="95" r="72" fill="#0f1726" opacity="0.28" stroke="#ffffff" stroke-width="6"/>
      <circle cx="760" cy="95" r="42" fill="#74b9ff" opacity="0.4"/>

      <rect x="28" y="24" width="196" height="24" rx="12" fill="#0f1726" opacity="0.35"/>
      <text x="126" y="40" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700" letter-spacing="0.8">SISTEM INFORMASI DIGITAL</text>

      <text x="28" y="80" fill="#ffffff" font-size="28" font-weight="800">Solusi Laundry Bersih, Wangi</text>
      <text x="28" y="112" fill="#ffffff" font-size="28" font-weight="800">&amp; Tepat Waktu Setiap Hari</text>
      <text x="28" y="138" fill="#e6f7ff" font-size="13">Cek daftar paket layanan, kalkulator estimasi harga per kilogram, dan status cucian secara instan.</text>

      <rect x="28" y="150" width="142" height="30" rx="8" fill="#ffffff"/>
      <text x="99" y="169" text-anchor="middle" fill="#0984e3" font-size="12" font-weight="800">Hitung Estimasi →</text>
    </g>

    <!-- Section Title -->
    <text x="30" y="346" fill="#ffffff" font-size="16" font-weight="800">Varian Paket Layanan &amp; Daftar Harga</text>
    <text x="30" y="364" fill="#7f95b8" font-size="12">Pilih layanan sesuai kebutuhan cucian harian maupun ekspres</text>

    <!-- 3 Service Package Cards -->
    <!-- Package 1 -->
    <g transform="translate(30, 382)">
      <rect x="0" y="0" width="240" height="225" rx="14" fill="#172338" stroke="#283c5f"/>
      <rect x="18" y="18" width="44" height="44" rx="12" fill="#0984e3" opacity="0.2"/>
      <text x="40" y="46" text-anchor="middle" font-size="22">👕</text>
      <text x="18" y="86" fill="#ffffff" font-size="15" font-weight="700">Cuci Kering Lipat</text>
      <text x="18" y="106" fill="#8ba0c2" font-size="11.5">Pakaian harian bersih, kering,</text>
      <text x="18" y="122" fill="#8ba0c2" font-size="11.5">dan dilipat rapi siap masuk lemari.</text>
      <text x="18" y="156" fill="#00cec9" font-size="20" font-weight="800">Rp 6.000 <tspan fill="#8ba0c2" font-size="12" font-weight="500">/ kg</tspan></text>
      <rect x="18" y="174" width="204" height="34" rx="8" fill="#1e2f4a"/>
      <text x="120" y="195" text-anchor="middle" fill="#74b9ff" font-size="11.5" font-weight="700">Estimasi Selesai: 2 Hari</text>
    </g>

    <!-- Package 2 -->
    <g transform="translate(290, 382)">
      <rect x="0" y="0" width="240" height="225" rx="14" fill="#192842" stroke="#00cec9" stroke-width="2"/>
      <rect x="150" y="14" width="74" height="22" rx="11" fill="#00b894"/>
      <text x="187" y="29" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="800">TERPOPULER</text>
      <rect x="18" y="18" width="44" height="44" rx="12" fill="#00cec9" opacity="0.2"/>
      <text x="40" y="46" text-anchor="middle" font-size="22">✨</text>
      <text x="18" y="86" fill="#ffffff" font-size="15" font-weight="700">Cuci + Setrika Uap</text>
      <text x="18" y="106" fill="#8ba0c2" font-size="11.5">Cuci bersih, parfum premium tahan</text>
      <text x="18" y="122" fill="#8ba0c2" font-size="11.5">lama, dan setrika uap anti kusut.</text>
      <text x="18" y="156" fill="#00cec9" font-size="20" font-weight="800">Rp 8.000 <tspan fill="#8ba0c2" font-size="12" font-weight="500">/ kg</tspan></text>
      <rect x="18" y="174" width="204" height="34" rx="8" fill="url(#tealBtn)"/>
      <text x="120" y="195" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="700">Pilih Paket Layanan</text>
    </g>

    <!-- Package 3 -->
    <g transform="translate(550, 382)">
      <rect x="0" y="0" width="240" height="225" rx="14" fill="#172338" stroke="#283c5f"/>
      <rect x="18" y="18" width="44" height="44" rx="12" fill="#6c5ce7" opacity="0.25"/>
      <text x="40" y="46" text-anchor="middle" font-size="22">⚡</text>
      <text x="18" y="86" fill="#ffffff" font-size="15" font-weight="700">Paket Express 6 Jam</text>
      <text x="18" y="106" fill="#8ba0c2" font-size="11.5">Layanan prioritas selesai di hari</text>
      <text x="18" y="122" fill="#8ba0c2" font-size="11.5">yang sama lengkap cuci &amp; setrika.</text>
      <text x="18" y="156" fill="#a29bfe" font-size="20" font-weight="800">Rp 15.000 <tspan fill="#8ba0c2" font-size="12" font-weight="500">/ kg</tspan></text>
      <rect x="18" y="174" width="204" height="34" rx="8" fill="#1e2f4a"/>
      <text x="120" y="195" text-anchor="middle" fill="#a29bfe" font-size="11.5" font-weight="700">Selesai Hari Ini (6 Jam)</text>
    </g>
  </g>

  <!-- ==================== OVERLAPPING MOBILE RESPONSIVE VIEW ==================== -->
  <g transform="translate(885, 165)" filter="url(#windowShadow)" font-family="'Inter', sans-serif">
    <rect x="0" y="0" width="330" height="585" rx="34" fill="#162238" stroke="#00cec9" stroke-width="2.5"/>
    <rect x="12" y="12" width="306" height="561" rx="26" fill="#0f1829"/>
    <rect x="115" y="20" width="100" height="16" rx="8" fill="#1a2740"/>

    <!-- Mobile App Bar -->
    <circle cx="42" cy="60" r="13" fill="url(#heroBanner)"/>
    <text x="42" y="64" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="800">LK</text>
    <text x="64" y="65" fill="#ffffff" font-size="14" font-weight="800">Laundry Kita Mobile</text>

    <!-- Price Estimator Card -->
    <g transform="translate(26, 90)">
      <rect x="0" y="0" width="278" height="224" rx="16" fill="#16233a" stroke="#2a4066"/>
      <text x="18" y="28" fill="#00cec9" font-size="11" font-weight="700" letter-spacing="1">SIMULASI BIAYA CUCIAN</text>
      <text x="18" y="50" fill="#ffffff" font-size="15" font-weight="800">Kalkulator Estimasi Harga</text>

      <text x="18" y="80" fill="#93a8c9" font-size="11">Jenis Layanan</text>
      <rect x="18" y="88" width="242" height="36" rx="8" fill="#0f1829" stroke="#2c446b"/>
      <text x="30" y="110" fill="#ffffff" font-size="12" font-weight="600">Cuci + Setrika Uap (Rp 8.000/kg)</text>

      <text x="18" y="146" fill="#93a8c9" font-size="11">Berat Cucian: <tspan fill="#ffffff" font-weight="700">5 Kg</tspan></text>
      <rect x="18" y="156" width="242" height="8" rx="4" fill="#0f1829"/>
      <rect x="18" y="156" width="150" height="8" rx="4" fill="url(#tealBtn)"/>
      <circle cx="168" cy="160" r="8" fill="#ffffff"/>

      <rect x="18" y="178" width="242" height="34" rx="8" fill="#102a38" stroke="#00b894"/>
      <text x="30" y="199" fill="#b2f5ea" font-size="12" font-weight="600">Total Estimasi:</text>
      <text x="246" y="199" text-anchor="end" fill="#55efc4" font-size="14" font-weight="800">Rp 40.000</text>
    </g>

    <!-- Operational Info Card -->
    <g transform="translate(26, 330)">
      <rect x="0" y="0" width="278" height="162" rx="16" fill="#16233a" stroke="#2a4066"/>
      <text x="18" y="28" fill="#ffffff" font-size="13.5" font-weight="700">🕒  Informasi Jam Operasional</text>

      <text x="18" y="56" fill="#93a8c9" font-size="11.5">Senin – Sabtu</text>
      <text x="260" y="56" text-anchor="end" fill="#ffffff" font-size="11.5" font-weight="700">08.00 – 20.00 WIB</text>

      <text x="18" y="80" fill="#93a8c9" font-size="11.5">Minggu &amp; Hari Libur</text>
      <text x="260" y="80" text-anchor="end" fill="#ffffff" font-size="11.5" font-weight="700">09.00 – 17.00 WIB</text>

      <text x="18" y="104" fill="#93a8c9" font-size="11.5">Status Outlet</text>
      <text x="260" y="104" text-anchor="end" fill="#55efc4" font-size="11.5" font-weight="700">● Buka · Siap Jemput</text>

      <rect x="18" y="118" width="242" height="32" rx="8" fill="url(#tealBtn)"/>
      <text x="139" y="138" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Hubungi via WhatsApp</text>
    </g>

    <!-- Bottom Pill -->
    <rect x="105" y="554" width="120" height="5" rx="2.5" fill="#32486e"/>
  </g>
</svg>
