        <text x="52" y="50" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Pilih Produk</text>

        <rect x="117" y="0" width="104" height="72" rx="12" fill="#181e38" stroke="#00e5ff"/>
        <text x="169" y="30" text-anchor="middle" fill="#00e5ff" font-size="11" font-weight="700">STEP 2</text>
        <text x="169" y="50" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Scan QRIS</text>

        <rect x="234" y="0" width="104" height="72" rx="12" fill="#181e38" stroke="#00e6a8"/>
        <text x="286" y="30" text-anchor="middle" fill="#00e6a8" font-size="11" font-weight="700">STEP 3</text>
        <text x="286" y="50" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Struk Digital</text>
