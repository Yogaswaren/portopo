      <text x="26" y="38" fill="#00e6a8" font-size="11" font-weight="700" letter-spacing="1.8">04 · USABILITY TESTING</text>
      <text x="26" y="62" fill="#ffffff" font-size="18" font-weight="800">Responsive &amp; Accessible UI</text>

      <g transform="translate(26, 84)">
