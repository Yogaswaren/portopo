        <rect x="76" y="36" width="22" height="61" rx="6" fill="#28325c"/>
        <rect x="114" y="10" width="22" height="87" rx="6" fill="url(#violetCyan)"/>
        <rect x="152" y="22" width="22" height="75" rx="6" fill="#7c5cff"/>
