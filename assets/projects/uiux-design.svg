<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgUiux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b16"/>
      <stop offset="50%" stop-color="#12162b"/>
      <stop offset="100%" stop-color="#0b0e1d"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="pinkOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b8b"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <radialGradient id="glowCenter" cx="55%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardDrop" x="-12%" y="-10%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#2a3158" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="800" fill="url(#bgUiux)"/>
  <rect width="1280" height="800" fill="url(#dotGrid)"/>
  <rect width="1280" height="800" fill="url(#glowCenter)"/>

  <!-- Top Figma-style Toolbar -->
  <g transform="translate(55, 36)" font-family="'Inter', sans-serif">
    <rect x="0" y="0" width="1170" height="48" rx="12" fill="#151930" stroke="#2c3560" stroke-width="1.5"/>
    <circle cx="26" cy="24" r="7" fill="#ff5f57"/>
    <circle cx="48" cy="24" r="7" fill="#febc2e"/>
    <circle cx="70" cy="24" r="7" fill="#28c840"/>
    <text x="104" y="29" fill="#ffffff" font-size="13" font-weight="700">UI/UX Design System &amp; Mobile App Prototype</text>
    <rect x="425" y="12" width="96" height="24" rx="12" fill="#7c5cff" opacity="0.25"/>
    <text x="473" y="28" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">Figma v2.4</text>
    <text x="1145" y="29" text-anchor="end" fill="#00e5ff" font-size="12" font-weight="700">● Auto-Layout Ready</text>
