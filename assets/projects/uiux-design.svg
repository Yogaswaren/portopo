      <rect x="14" y="12" width="40" height="40" rx="10" fill="#7c5cff" opacity="0.22"/>
      <text x="34" y="37" text-anchor="middle" font-size="18">🛍️</text>
      <text x="66" y="28" fill="#ffffff" font-size="13" font-weight="700">Order #POS-2094</text>
      <text x="66" y="46" fill="#8e98be" font-size="11">Wimaka Bakery · 4 Item</text>
      <text x="288" y="37" text-anchor="end" fill="#00e6a8" font-size="13" font-weight="800">+Rp 185K</text>

