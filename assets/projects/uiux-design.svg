        <text x="18" y="34" fill="#00e5ff" font-size="24" font-weight="800">4.9/5</text>
        <text x="18" y="58" fill="#ffffff" font-size="12.5" font-weight="700">Visual Clarity</text>
        <text x="18" y="76" fill="#8e98be" font-size="10.5">WCAG AA Contrast Pass</text>

        <rect x="176" y="0" width="162" height="94" rx="14" fill="#181e38" stroke="#2a335c"/>
        <text x="194" y="34" fill="#00e6a8" font-size="24" font-weight="800">2.4x</text>
        <text x="194" y="58" fill="#ffffff" font-size="12.5" font-weight="700">Faster Task Flow</text>
        <text x="194" y="76" fill="#8e98be" font-size="10.5">Minimal Clicks to Action</text>

        <rect x="0" y="112" width="338" height="86" rx="14" fill="url(#violetCyan)" opacity="0.18"/>
