      <text x="30" y="84" text-anchor="middle" fill="#a5b0d6" font-size="10" font-weight="600">#7C5CFF</text>

      <rect x="70" y="0" width="60" height="68" rx="12" fill="#00e5ff"/>
      <text x="100" y="84" text-anchor="middle" fill="#a5b0d6" font-size="10" font-weight="600">#00E5FF</text>

