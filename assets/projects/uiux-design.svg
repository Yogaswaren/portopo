  <!-- Prototype Connector Line -->
  <path d="M 785 280 C 810 280, 810 220, 835 220" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="6,5"/>
  <circle cx="785" cy="280" r="5" fill="#00e5ff"/>
  <circle cx="835" cy="220" r="5" fill="#00e5ff"/>

